<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner - NutriScan AI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <nav class="navbar">
        <div class="logo">NutriScan AI</div>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/about">About</a></li>
        </ul>
    </nav>
</header>

<section class="scanner-page">

    <div class="scanner-card">

        <div class="scanner-header">
            <h1>Live Food Scanner</h1>
            <p>Capture or upload a food label for AI analysis</p>
        </div>

        <!-- CAMERA -->
        <div class="camera-wrapper">
            <video id="camera" autoplay playsinline></video>
        </div>

        <p id="cameraStatus" class="status-pill">Starting camera...</p>

        <!-- BUTTONS -->
        <div class="scanner-buttons">
            <button id="captureBtn" class="primary-btn">📸 Capture</button>
            <button id="analyzeBtn" class="secondary-btn">🔍 Analyze</button>
        </div>

        <!-- UPLOAD -->
        <input type="file" id="imageUpload" accept="image/*">

        <!-- HIDDEN CANVAS -->
        <canvas id="canvas" hidden></canvas>

        <!-- PREVIEW -->
        <div class="preview-box">
            <br><br>
            <img id="preview" hidden />
            <p id="emptyPreview">No image selected</p>
        </div>

        <!-- LOADING -->
        <div id="loading" class="loading hidden">
            Analyzing nutrition data...
        </div>

        <!-- MESSAGE -->
        <p id="message" class="form-message"></p>

        <!-- RESULT -->
        <div id="output" class="result-card"></div>

    </div>

</section>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
