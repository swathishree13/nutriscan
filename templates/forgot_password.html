<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | NutriScan AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">NutriScan AI</div>
        </nav>
    </header>
    <section class="scanner-page">
        <div class="scanner-card">
            <div class="scanner-header">
                <h1>Forgot Password</h1>
                <p>Enter your email and we will send a recovery link.</p>
            </div>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <p class="{{ category }}">{{ message }}</p>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            <form method="POST">
                <input type="email" name="email" placeholder="Email" required>
                <button type="submit" class="primary-btn">Send Reset Link</button>
            </form>
            <p style="text-align:center; margin-top:20px;"><a href="/login">Back to login</a></p>
        </div>
    </section>
</body>
</html>
